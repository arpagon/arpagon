<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">From physical signals to frontline action</title>
  <desc id="desc">Existing cameras and physical signals flow through edge and cloud systems into real-time AI that assists frontline teams.</desc>
  <rect width="1200" height="210" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="1198" height="208" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="42" y="40" fill="#8b949e" font-size="15" letter-spacing="2">FROM REALITY TO USEFUL ACTION</text>
    <g fill="#161b22" stroke="#30363d" stroke-width="2">
      <rect x="42" y="68" width="270" height="105" rx="12"/>
      <rect x="465" y="68" width="270" height="105" rx="12"/>
      <rect x="888" y="68" width="270" height="105" rx="12"/>
    </g>
    <g stroke="#ff5a5f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 120H452"/><path d="M441 110L453 120L441 130"/>
      <path d="M735 120H875"/><path d="M864 110L876 120L864 130"/>
    </g>
    <g text-anchor="middle">
      <text x="177" y="112" fill="#f0f6fc" font-size="22" font-weight="700">CAMERAS + SIGNALS</text>
      <text x="177" y="143" fill="#8b949e" font-size="14">THE PHYSICAL WORLD</text>
      <text x="600" y="112" fill="#ff6b70" font-size="22" font-weight="700">REAL-TIME AI</text>
      <text x="600" y="143" fill="#8b949e" font-size="14">EDGE + CLOUD</text>
      <text x="1023" y="112" fill="#f0f6fc" font-size="22" font-weight="700">FRONTLINE ACTION</text>
      <text x="1023" y="143" fill="#8b949e" font-size="14">SEE · DECIDE · ASSIST</text>
    </g>
  </g>
</svg>
