<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Selected proof of work</title>
  <desc id="desc">More than 15 years building real-time systems, more than 5.7 thousand GitHub contributions in the last twelve months, 14 international customers, and a customer footprint of more than 500 locations.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="220" rx="18" fill="#0d1117"/>
  <rect width="1200" height="220" rx="18" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <circle cx="42" cy="34" r="5" fill="#ff5a5f"/>
    <text x="58" y="40" fill="#8b949e" font-size="15" letter-spacing="2">PROOF OF WORK / CURRENT SIGNAL</text>
    <g stroke="#30363d" stroke-width="1"><line x1="300" y1="65" x2="300" y2="190"/><line x1="600" y1="65" x2="600" y2="190"/><line x1="900" y1="65" x2="900" y2="190"/></g>
    <g text-anchor="middle">
      <text x="150" y="125" fill="#f0f6fc" font-size="47" font-weight="700">15+</text>
      <text x="150" y="155" fill="#ff6b70" font-size="14" font-weight="700" letter-spacing="1">YEARS</text>
      <text x="150" y="180" fill="#8b949e" font-size="13">REAL-TIME SYSTEMS</text>

      <text x="450" y="125" fill="#f0f6fc" font-size="47" font-weight="700">5.7K+</text>
      <text x="450" y="155" fill="#ff6b70" font-size="14" font-weight="700" letter-spacing="1">CONTRIBUTIONS</text>
      <text x="450" y="180" fill="#8b949e" font-size="13">LAST 12 MONTHS</text>

      <text x="750" y="125" fill="#f0f6fc" font-size="47" font-weight="700">14</text>
      <text x="750" y="155" fill="#ff6b70" font-size="14" font-weight="700" letter-spacing="1">CUSTOMERS</text>
      <text x="750" y="180" fill="#8b949e" font-size="13">INTERNATIONAL</text>

      <text x="1050" y="125" fill="#f0f6fc" font-size="47" font-weight="700">500+</text>
      <text x="1050" y="155" fill="#ff6b70" font-size="14" font-weight="700" letter-spacing="1">LOCATIONS</text>
      <text x="1050" y="180" fill="#8b949e" font-size="13">CUSTOMER FOOTPRINT</text>
    </g>
  </g>
</svg>
